name: Build Vajra Kernel (redwood)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential curl flex \
            libelf-dev libssl-dev libncurses-dev \
            python3 python3-pip rsync unzip zip git

      - name: Sanity check — required defconfig fragments exist
        run: |
          test -f arch/arm64/configs/vendor/xiaomi-qgki_defconfig || \
            { echo "::error::vendor/xiaomi-qgki_defconfig not found — check repo layout"; exit 1; }
          test -f arch/arm64/configs/vendor/redwood.config || \
            { echo "::error::arch/arm64/configs/vendor/redwood.config missing"; exit 1; }
          test -f arch/arm64/configs/vendor/vajra.config || \
            { echo "::error::arch/arm64/configs/vendor/vajra.config missing"; exit 1; }
          test -f scripts/config || \
            { echo "::error::scripts/config not found — cannot disable MODULE_SIG"; exit 1; }

      - name: Cache Neutron Clang toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchains/neutron-clang
          key: neutron-clang-24-${{ runner.os }}

      - name: Download Neutron Clang 24
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/toolchains/neutron-clang"
          cd "${{ github.workspace }}/toolchains/neutron-clang"
          curl -LO --retry 3 "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          # If you need to pin an exact Clang 24 build instead of whatever is
          # latest, find its tag under Neutron-Toolchains/clang-build-catalogue
          # Releases and replace "-S" with "-S=<tag>" so it's reproducible.

      - name: Build kernel
        run: |
          export PATH="${{ github.workspace }}/toolchains/neutron-clang/bin:$PATH"
          export KBUILD_BUILD_USER=genie
          export KBUILD_BUILD_HOST=vajra

          ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"

          make -j$(nproc) O=out $ARGS vendor/xiaomi-qgki_defconfig

          scripts/kconfig/merge_config.sh -O out -m out/.config \
            arch/arm64/configs/vendor/redwood.config \
            arch/arm64/configs/vendor/vajra.config

          # --- Disable module signature verification before the final build ---
          ./scripts/config --file out/.config \
            -d MODULE_SIG \
            -d MODULE_SIG_FORCE \
            -d MODULE_SIG_ALL \
            -d MODULE_SIG_PROTECT

          make -j$(nproc) O=out $ARGS olddefconfig
          make -j$(nproc) O=out $ARGS Image

      - name: Confirm module signing is off
        run: |
          if grep -qE "^CONFIG_MODULE_SIG(_FORCE|_ALL)?=y" out/.config; then
            echo "::error::MODULE_SIG is still enabled in out/.config"; exit 1
          fi
          echo "Module signature verification is disabled."

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: redwood-hackX-Image
          path: out/arch/arm64/boot/Image
          if-no-files-found: error

      - name: Build metadata
        id: meta
        run: |
          echo "date=$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # --- GENERIC AnyKernel3 (osm0sis/AnyKernel3), configured for redwood. ---
      # Replace this with your own device-specific AnyKernel3 fork/anykernel.sh
      # whenever you have one — just swap the git clone URL below.
      - name: Clone AnyKernel3 template
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          rm -rf anykernel3/.git

      - name: Configure anykernel.sh for redwood
        run: |
          cd anykernel3
          sed -i "s/^kernel\.string=.*/kernel.string=Vajra Kernel by aafiqbinkhayer-Toshiro @ redwood_hackX/" anykernel.sh
          sed -i "s/^do\.devicecheck=.*/do.devicecheck=1/" anykernel.sh
          sed -i "s/^do\.modules=.*/do.modules=1/" anykernel.sh
          sed -i "s/^device\.name1=.*/device.name1=redwood/" anykernel.sh
          sed -i "/^device\.name[2-5]=/d" anykernel.sh
          sed -i "s#^block=.*#block=/dev/block/bootdevice/by-name/boot;#" anykernel.sh
          sed -i "s/^is_slot_device=.*/is_slot_device=auto;/" anykernel.sh
          sed -i "s/^ramdisk_compression=.*/ramdisk_compression=auto;/" anykernel.sh
          # NOTE: is_slot_device is left as "auto" (detects A-only vs A/B at
          # flash time) since redwood's exact partition layout isn't confirmed
          # here. Verify block= and is_slot_device against a real device/ROM
          # once you swap in a device-specific AnyKernel3.

      - name: Package flashable zip
        id: package
        run: |
          cp out/arch/arm64/boot/Image anykernel3/Image
          cd anykernel3
          ZIP_NAME="Vajra-redwood-hackX-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.short_sha }}.zip"
          zip -r9 "../$ZIP_NAME" . -x ".git*"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: redwood-hackX-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.short_sha }}
          name: Vajra redwood_hackX build ${{ steps.meta.outputs.date }}
          files: ${{ steps.package.outputs.zip_name }}
